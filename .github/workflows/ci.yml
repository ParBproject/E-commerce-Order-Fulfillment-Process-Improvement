name: Operations analytics quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint critical errors
        run: ruff check app.py src analytics tests --select E4,E7,E9,F

      - name: Compile Python sources
        run: python -m compileall -q app.py src analytics tests

      - name: Run analytics tests
        run: python -m pytest -q

      - name: Execute DuckDB analytical model
        run: python analytics/run_analysis.py

      - name: Verify exported analytics
        run: |
          test -s outputs/state_kpis.csv
          test -s outputs/bottleneck_pareto.csv
          test -s outputs/data_quality_report.csv
