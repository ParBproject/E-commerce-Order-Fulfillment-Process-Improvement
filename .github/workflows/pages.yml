name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build metrics and KPI board
        run: python -m bayline
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/dashboard
          cp index.html demo.css demo.js _site/
          cp -a dashboard/. _site/dashboard/
          : > _site/.nojekyll
          test -s _site/index.html
          test -s _site/demo.js
          test -s _site/demo.css
          test -s _site/dashboard/index.html
          test -s _site/dashboard/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("_site/dashboard/metrics.json").read_text())
          periods = {row["period"] for row in payload["kpi_period"]}
          if periods != {"baseline", "pilot"}:
              raise SystemExit(f"kpi_period missing a scenario: {periods}")
          if not payload.get("orders"):
              raise SystemExit("metrics.json has no orders")
          print(
              "site ok",
              payload["money"]["window_usd"],
              "window_usd",
          )
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
